name: Task
description: A unit of work from ROADMAP.md
labels: []
body:
  - type: input
    id: task
    attributes:
      label: Roadmap task ID
      description: The ID from ROADMAP.md (e.g. C-09). Add a new task to ROADMAP.md first if none fits.
      placeholder: C-09
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options:
        - "trivial (100 pts)"
        - "medium (150 pts)"
        - "high (200 pts)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed, with links to PRD / ARCHITECTURE sections.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions for "done", one checkbox each. Every CI gate passing and the ROADMAP.md update are always required.
      value: |
        - [ ] 
        - [ ] Every CI gate passes
        - [ ] `ROADMAP.md` updated: task status, progress counts, one Update log line
    validations:
      required: true
  - type: textarea
    id: tech-stack
    attributes:
      label: Tech stack
      description: Languages, versions and tools the change touches.
      value: |
        - Node 24, Next.js, TypeScript (strict), pnpm
        - Postgres (`migrations/`), `@stellar/stellar-sdk` (RPC `getEvents`)
        - Tests: Vitest (`pnpm test`), Playwright e2e, `pnpm typecheck`
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files involved
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
