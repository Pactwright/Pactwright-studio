name: live-verify
# Scheduled live root-verifying check against testnet (ROADMAP S-04, S-10, XC-03, #54).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations and seed data
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Run live testnet verification suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          RECEIPT_ANCHOR_ID: ${{ secrets.RECEIPT_ANCHOR_ID }}
          PACT_CONTRACT_ID: ${{ secrets.PACT_CONTRACT_ID }}
          ANCHORER_SECRET: ${{ secrets.ANCHORER_SECRET }}
        run: pnpm --filter web live:testnet
