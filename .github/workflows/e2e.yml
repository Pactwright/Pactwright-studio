name: e2e
# Playwright e2e for the pact page and certificate viewer (ROADMAP S-09).
on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aaedc027415b4 # v3.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations and seed data
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Build web application
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps
      - name: Run Playwright e2e tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter web e2e
