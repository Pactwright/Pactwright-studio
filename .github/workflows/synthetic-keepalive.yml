name: synthetic-keepalive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier web services from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Synthetic Keepalive & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run Synthetic Keepalive Probe
        run: node scripts/synthetic-keepalive.mjs
