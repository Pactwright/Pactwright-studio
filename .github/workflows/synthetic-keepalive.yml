name: synthetic-keepalive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier web services from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Synthetic Keepalive & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Run Synthetic Keepalive Probe
        run: node scripts/synthetic-keepalive.mjs
