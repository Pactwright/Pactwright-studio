name: synthetic-keepalive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier web services from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Synthetic Keepalive & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Synthetic Keepalive Probe
        run: node scripts/synthetic-keepalive.mjs
