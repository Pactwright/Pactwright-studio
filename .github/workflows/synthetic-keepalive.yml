name: synthetic-keepalive

on:
  schedule:
    # Probe the hosted testnet services every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Synthetic Keepalive & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run Synthetic Keepalive Probe
        run: node scripts/synthetic-keepalive.mjs
