name: synthetic-keepalive

on:
  schedule:
    # Probe the hosted testnet services every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Synthetic Keepalive & Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run Synthetic Keepalive Probe
        run: node scripts/synthetic-keepalive.mjs
