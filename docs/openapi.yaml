                description: "`pact`, or `refund_vault:<contract>`."
              reason:
                type: string
                enum: [outsideRetention, readFailed]
                description: >-
                  `outsideRetention` will not fix itself: it needs /api/backfill with a history
                  source.
              cursor:
                type: integer
                description: "The ledger this source's pass stopped at."
              oldestLedger:
                type: integer
                description: The oldest ledger the RPC still keeps.
              message:
                type: string
        failedSources:
          type: array
          items:
            type: object
            description: >-
              One source this pass could not read. Its cursor did not move, so nothing it had
              not read was marked as read.
            required: [source, reason, cursor, oldestLedger, message]
            properties:
              source:
