                description: "`pact`, or `refund_vault:<contract>`."
              reason:
                type: string
                enum: [outsideRetention, readFailed]
                description: >-
                  `outsideRetention` will not fix itself: it needs /api/backfill with a history
                  source.
              cursor:
                type: integer
                description: "The ledger this source's pass stopped at."
              oldestLedger:
                type: integer
                description: The oldest ledger the RPC still keeps.
              message:
                type: string
        result:
          type: object
          description: One indexing pass over every source.
          required: [sources, failures, replayed, deferred]
          properties:
            sources:
              type: array
              items:
                type: object
                required: [source, fromLedger, toLedger, indexed, deferred]
                properties:
                  source:
                    type: string
                  fromLedger:
                    type: integer
                  toLedger:
                    type: integer
                  indexed:
                    type: integer
                  deferred:
                    type: integer
                    description: >-
                      Events whose pact row does not exist yet; held in `deferred_events` and
                      replayed by later passes.
            failures:
              type: array
              items:
                type: object
                description: >-
                  One source this pass could not read. Its cursor did not move, so nothing it
                  had not read was marked as read.
                required: [source, reason, cursor, oldestLedger, message]
                properties:
                  source:
                    type: string
                    description: "`pact`, or `refund_vault:<contract>`."
                  reason:
                    type: string
                    enum: [outsideRetention, readFailed]
                    description: >-
                      `outsideRetention` will not fix itself: it needs /api/backfill with a
                      history source.
                  cursor:
                    type: integer
                    description: "The ledger this source's pass stopped at."
                  oldestLedger:
                    type: integer
                    description: The oldest ledger the RPC still keeps.
                  message:
                    type: string
              description: Empty when every source could be read.
            replayed:
              type: integer
              description: "Deferred events this pass's replay wrote."
            deferred:
