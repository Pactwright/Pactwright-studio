                      replayed by later passes.
            failures:
              type: array
              items:
                type: object
                description: >-
                  One source this pass could not read. Its cursor did not move, so nothing it
                  had not read was marked as read.
                required: [source, reason, cursor, oldestLedger, message]
                properties:
                  source:
                    type: string
                    description: "`pact`, or `refund_vault:<contract>`."
                  reason:
                    type: string
                    enum: [outsideRetention, readFailed]
                    description: >-
