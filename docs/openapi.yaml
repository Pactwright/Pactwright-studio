openapi: 3.1.0
info:
  title: Pactwright Studio HTTP API
  version: 1.0.0
  description: >-
    The public record of purchases made by AI agents on Stellar, as Studio indexes it. Reads
    answer from the database the indexer writes, never from the chain directly — except `POST
    /api/certificates/verify`, which asks the ReceiptAnchor contract. Routes marked internal are
    Studio's own operations endpoints behind `CRON_SECRET` and are not part of this contract.
  license:
    name: MIT
    url: https://github.com/Pactwright/Pactwright-studio/blob/main/LICENSE
servers:
  - url: https://pactwright-studio.vercel.app
    description: Testnet deployment.
  - url: http://localhost:3000
    description: Local development.
tags:
  - name: Pacts
    description: "What was bought, and where the money went."
  - name: Certificates
    description: Receipts and their on-chain proofs.
  - name: Ops
    description: Monitoring probes.
  - name: Internal
    description: >-
      Cron and operator routes behind `CRON_SECRET`. Documented so the shapes are not folklore;
      not a public contract.
paths:
  /api/pacts:
    get:
      operationId: listPacts
      tags: [Pacts]
      summary: "Page through the indexed ledger, newest first"
      description: >-
        The collection the dashboards and agents need: `GET /api/pacts/{id}` answers one pact,
        and without this a caller that wants 'what is on chain' pays N requests for N pacts.
        Paging is a keyset on `(created_at, pact_id) DESC` rather than an offset, because the
        indexer is still appending rows above the page a caller is reading, so an offset repeats
        or drops a pact.
      parameters:
        - name: state
          in: query
          description: Only pacts in this state. An empty value means no filter.
          schema:
            type: string
            enum:
              - funded
              - paid
              - allowed
              - denied
              - settled
              - released
              - refunded
        - name: seller
          in: query
          description: Only pacts sold by this Stellar account.
          schema:
            type: string
            pattern: "^G[A-Z2-7]{55}$"
        - name: limit
          in: query
          description: "Rows per page, 1 to 100."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: "A `nextCursor` from the previous page, passed unchanged."
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PactPage"
        "400":
          description: >-
            A parameter was refused, and the reason names it. A cursor that does not decode is a
            400 rather than an empty page, because an empty list would read as 'the chain has no
            more pacts' and stop a paging loop early.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The reason, in a sentence a caller can show the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/pacts/{id}":
    get:
      operationId: getPact
      tags: [Pacts]
      summary: One pact and its event timeline
      responses:
        "200":
          description: "The pact and every event indexed for it, oldest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PactDetails"
        "400":
          description: The id is not 64 hexadecimal characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No pact with that id has been indexed. It may exist on chain and not be indexed yet
            — `GET /api/sync` reads the chain on demand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The reason, in a sentence a caller can show the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          description: "64 hexadecimal characters: a pact id, or a certificate's leaf."
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
  "/api/certificates/{id}":
    get:
      operationId: getCertificate
      tags: [Certificates]
      summary: "One receipt certificate, pending or anchored"
      description: >-
        `id` is the pact id or the leaf itself. An anchored certificate carries the batch id and
        proof to re-run `verify_receipt` with, and `onChainVerified` from the read this response
        made.
      parameters:
        - name: id
          in: path
          required: true
          description: "64 hexadecimal characters: a pact id, or a certificate's leaf."
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "400":
          description: The id is not 64 hexadecimal characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No receipt for that pact or leaf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The reason, in a sentence a caller can show the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/certificates/verify:
    post:
      operationId: verifyCertificate
      tags: [Certificates]
      summary: Check a proof against ReceiptAnchor on the chain
      description: >-
        The same call the viewer makes in the browser, for a caller that wants the contract's
        own answer. A false result is a 200: the contract says the proof does not verify. A 500
        means the request itself could not be read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: What the contract answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
        "400":
          description: "`batchId`, `leaf` or `proof` was missing or the wrong shape."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The reason, in a sentence a caller can show the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/ops/health:
    get:
      operationId: getHealth
      tags: [Ops]
      summary: "Every monitoring signal, each measured from its own source"
      description: >-
        Sponsor balance from the ledger entry, indexer lag and backlog from the RPC and the
        database, verifier error rate from the verifier's own counters. A signal whose source
        cannot be read is a failing probe with no value, so an outage is visible rather than
        green.
      responses:
        "200":
          description: All probes passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: >-
            At least one probe failed, or health could not be measured at all (a deployment with
            no RPC or database configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /api/ops/liveness:
    get:
      operationId: getLiveness
      tags: [Ops]
      summary: The process is up
      description: >-
        Answers without touching the database or the chain, so a probe failure here means the
        app is not running rather than a source is unreachable.
      responses:
        "200":
          description: Running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /api/sync:
    get:
      operationId: runSync
      tags: [Internal]
      summary: One indexing pass over every source
      x-internal: true
      description: >-
        Internal: `studio-cron` calls this every few minutes with the `CRON_SECRET` bearer
        token. Not part of the public API; it writes rows and moves cursors.
      responses:
        "200":
          description: "The pass, source by source."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
        "401":
          description: "The bearer token or `x-cron-secret` header did not match `CRON_SECRET`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            A source could not be read for another reason, or the pass could not run at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronRefusal"
        "503":
          description: >-
            Either no `CRON_SECRET` is configured, or a source's cursor is older than the RPC's
            retention. In the second case the other sources were still indexed and that cursor
            did not move; it will not fix itself, it needs `/api/backfill`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronRefusal"
  /api/anchor:
    get:
      operationId: runAnchor
      tags: [Internal]
      summary: One anchoring cycle
      x-internal: true
      description: >-
        Internal: scheduled hourly by `studio-cron` with the `CRON_SECRET` bearer token. Batches
        pending receipts into the chain, so it signs transactions that cost money, and fails
        closed when `CRON_SECRET` is unset.
      responses:
        "200":
          description: "The batch anchored, or `result: null` when there was nothing to anchor."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorRun"
        "401":
          description: Wrong secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The reason, in a sentence a caller can show the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`CRON_SECRET` is not configured, so the route will not run."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/backfill:
    get:
      operationId: runBackfill
      tags: [Internal]
      summary: "Close an indexing gap from a history source, then resume the pass"
      x-internal: true
      description: >-
        Internal: the recovery path for a 503 from `/api/sync`. Needs `HISTORY_RPC_URL` (an
        archival RPC) or `HISTORY_SOURCE_URL`, and the same `CRON_SECRET` as `/api/sync`.
      responses:
        "200":
          description: "The ranges read from history, then the pass that resumed from them."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillRun"
        "401":
          description: Wrong secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            The backfill could not run; `reason` is the history source's own refusal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronRefusal"
        "503":
          description: >-
            No `CRON_SECRET`, no history source configured (`noHistorySource`, and no retry of
            this route will change that), or a source that still cannot be read after the
            backfill (`outsideRetention`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronRefusal"
components:
  schemas:
    Error:
      type: object
      description: >-
        A refusal. The reason names the parameter or the missing row, because a bare status
        makes a program guess.
      required: [error]
      properties:
        error:
          type: string
    Pact:
      type: object
      description: >-
        One row of `pacts` (migrations/001_core.sql). Amounts are decimal strings; deadlines are
        ledger numbers.
      required:
        - pact_id
        - mode
        - buyer
        - seller
        - resource_url
        - cap
        - condition_hash
        - condition
        - metered
        - silence
        - state
        - verdict_deadline
        - settle_deadline
        - to_seller
        - to_buyer
        - created_at
        - updated_at
      properties:
        pact_id:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        mode:
          type: string
          enum: [exact-refund, escrow]
          description: M0 and M2 only — there is no third mode.
        buyer:
          type: string
          pattern: "^G[A-Z2-7]{55}$"
        seller:
          type: string
          pattern: "^G[A-Z2-7]{55}$"
        resource_url:
          type: string
        cap:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "numeric(30,7): the most that can leave escrow."
        condition_hash:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        condition:
          type: object
          additionalProperties: true
          description: "The condition the verifier checks, as stored."
        metered:
          type: boolean
        silence:
          type: [string, "null"]
          enum: [refund, pay, null]
          description: What the deadline settles on if the verifier says nothing.
        state:
          type: string
          enum:
            - funded
            - paid
            - allowed
            - denied
            - settled
            - released
            - refunded
        verdict_deadline:
          type: [integer, "null"]
        settle_deadline:
          type: [integer, "null"]
        to_seller:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        to_buyer:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        created_at:
          type: string
          format: date-time
          description: When the pact was opened; the keyset cursor pages on this.
        updated_at:
          type: string
          format: date-time
    PactEvent:
      type: object
      description: "One indexed chain event, oldest first."
      required: [id, pact_id, stage, tx_hash, ledger, data]
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
          description: >-
            `pact_events.id` is a `bigserial`, and `pg` returns 8-byte integers as decimal
            strings so a value above `Number.MAX_SAFE_INTEGER` cannot lose digits. Sort on it:
            it is the index order the timeline is written in.
        pact_id:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        stage:
          type: string
          enum:
            - opened
            - paid
            - verdict
            - settled
            - meter_closed
            - released
            - refunded
        tx_hash:
          type: [string, "null"]
        ledger:
          type: [integer, "null"]
        data:
          type: object
          additionalProperties: true
          description: >-
            The event's own fields: `cap`, `verdict`, `amount`, `to_seller`, `to_buyer` as
            stroop strings.
    PactDetails:
      type: object
      description: A pact and its timeline.
      required: [pact, events]
      properties:
        pact:
          type: object
          description: >-
            One row of `pacts` (migrations/001_core.sql). Amounts are decimal strings; deadlines
            are ledger numbers.
          required:
            - pact_id
            - mode
            - buyer
            - seller
            - resource_url
            - cap
            - condition_hash
            - condition
            - metered
            - silence
            - state
            - verdict_deadline
            - settle_deadline
            - to_seller
            - to_buyer
            - created_at
            - updated_at
          properties:
            pact_id:
              type: string
              pattern: "^[0-9a-fA-F]{64}$"
            mode:
              type: string
              enum: [exact-refund, escrow]
              description: M0 and M2 only — there is no third mode.
            buyer:
              type: string
              pattern: "^G[A-Z2-7]{55}$"
            seller:
              type: string
              pattern: "^G[A-Z2-7]{55}$"
            resource_url:
              type: string
            cap:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "numeric(30,7): the most that can leave escrow."
            condition_hash:
              type: string
              pattern: "^[0-9a-fA-F]{64}$"
            condition:
              type: object
              additionalProperties: true
              description: "The condition the verifier checks, as stored."
            metered:
              type: boolean
            silence:
              type: [string, "null"]
              enum: [refund, pay, null]
              description: What the deadline settles on if the verifier says nothing.
            state:
              type: string
              enum:
                - funded
                - paid
                - allowed
                - denied
                - settled
                - released
                - refunded
            verdict_deadline:
              type: [integer, "null"]
            settle_deadline:
              type: [integer, "null"]
            to_seller:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
            to_buyer:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
            created_at:
              type: string
              format: date-time
              description: When the pact was opened; the keyset cursor pages on this.
            updated_at:
              type: string
              format: date-time
        events:
          type: array
          items:
            type: object
            description: "One indexed chain event, oldest first."
            required: [id, pact_id, stage, tx_hash, ledger, data]
            properties:
              id:
                type: string
                pattern: "^[0-9]+$"
                description: >-
                  `pact_events.id` is a `bigserial`, and `pg` returns 8-byte integers as decimal
                  strings so a value above `Number.MAX_SAFE_INTEGER` cannot lose digits. Sort on
                  it: it is the index order the timeline is written in.
              pact_id:
                type: string
                pattern: "^[0-9a-fA-F]{64}$"
              stage:
                type: string
                enum:
                  - opened
                  - paid
                  - verdict
                  - settled
                  - meter_closed
                  - released
                  - refunded
              tx_hash:
                type: [string, "null"]
              ledger:
                type: [integer, "null"]
              data:
                type: object
                additionalProperties: true
                description: >-
                  The event's own fields: `cap`, `verdict`, `amount`, `to_seller`, `to_buyer` as
                  stroop strings.
    PactPage:
      type: object
      description: >-
        One page of the ledger, newest first, plus the cursor that addresses the page after it.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            description: >-
              One row of `pacts` (migrations/001_core.sql). Amounts are decimal strings;
              deadlines are ledger numbers.
            required:
              - pact_id
              - mode
              - buyer
              - seller
              - resource_url
              - cap
              - condition_hash
              - condition
              - metered
              - silence
              - state
              - verdict_deadline
              - settle_deadline
              - to_seller
              - to_buyer
              - created_at
              - updated_at
            properties:
              pact_id:
                type: string
                pattern: "^[0-9a-fA-F]{64}$"
              mode:
                type: string
                enum: [exact-refund, escrow]
                description: M0 and M2 only — there is no third mode.
              buyer:
                type: string
                pattern: "^G[A-Z2-7]{55}$"
              seller:
                type: string
                pattern: "^G[A-Z2-7]{55}$"
              resource_url:
                type: string
              cap:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "numeric(30,7): the most that can leave escrow."
              condition_hash:
                type: string
                pattern: "^[0-9a-fA-F]{64}$"
              condition:
                type: object
                additionalProperties: true
                description: "The condition the verifier checks, as stored."
              metered:
                type: boolean
              silence:
                type: [string, "null"]
                enum: [refund, pay, null]
                description: What the deadline settles on if the verifier says nothing.
              state:
                type: string
                enum:
                  - funded
                  - paid
                  - allowed
                  - denied
                  - settled
                  - released
                  - refunded
              verdict_deadline:
                type: [integer, "null"]
              settle_deadline:
                type: [integer, "null"]
              to_seller:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              to_buyer:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              created_at:
                type: string
                format: date-time
                description: When the pact was opened; the keyset cursor pages on this.
              updated_at:
                type: string
                format: date-time
          description: "`limit` rows, or fewer on the last page."
        nextCursor:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Opaque keyset on `(created_at, pact_id) DESC`. Null when this is the oldest page —
            there is no page number to ask for, because a forward-only cursor cannot offer one.
    Certificate:
      type: object
      description: >-
        A receipt certificate: `pending` until its batch is anchored, then `anchored` with the
        proof and the batch id to verify on-chain.
      required:
        - pactId
        - transition
        - toSeller
        - toBuyer
        - leaf
        - leafInput
        - status
        - receiptAnchor
        - txs
      properties:
        pactId:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        transition:
          type: string
          enum: [paid, settled, released, refunded]
        toSeller:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        toBuyer:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        envelopeHash:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        leaf:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: "The Merkle leaf: hash of `leafInput`."
        leafInput:
          type: object
          description: >-
            The leaf's exact inputs, so anyone can recompute `leaf`. Amounts here are stroops,
            not decimal strings.
          required:
            - transition
            - toSellerStroops
            - toBuyerStroops
            - envelopeHash
            - ledger
          properties:
            transition:
              type: string
            toSellerStroops:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
            toBuyerStroops:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
            envelopeHash:
              type: [string, "null"]
            ledger:
              type: [integer, "null"]
        status:
          type: string
          enum: [pending, anchored]
        proof:
          type: array
          items:
            type: string
          description: Only when anchored.
        batchId:
          type: integer
          description: >-
            The ReceiptAnchor batch id: pass it with `leaf` and `proof` to `verify_receipt`.
            Only when anchored.
        root:
          type: string
          description: The anchored Merkle root this proof runs against. Only when anchored.
        receiptAnchor:
          type: string
          description: "The contract id the proof is verified against (`RECEIPT_ANCHOR_ID`)."
        anchorTx:
          type: string
        anchoredLedger:
          type: integer
        onChainVerified:
          type: boolean
          description: >-
            Present when the certificate was anchored: what `verify_receipt` answered when this
            response was built.
        txs:
          type: array
          items:
            type: object
            required: [stage, hash]
            properties:
              stage:
                type: string
              hash:
                type: string
    VerifyRequest:
      type: object
      description: >-
        The three things `verify_receipt` takes. `leaf` and each proof element are hex without a
        prefix.
      required: [batchId, leaf, proof]
      properties:
        batchId:
          type: integer
        leaf:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        proof:
          type: array
          items:
            type: string
        receiptAnchorId:
          type: string
          description: "Override the anchored contract; defaults to `RECEIPT_ANCHOR_ID`."
    VerifyResult:
      type: object
      description: >-
        What the chain said. `verified: false` with an `error` means the read failed, not that
        the proof was wrong — the contract answers false rather than throwing.
      required: [verified]
      properties:
        verified:
          type: boolean
        error:
          type: string
    HealthReport:
      type: object
      description: >-
        Every signal, whether it passed, and what it read. `healthy: false` comes with 503 so a
        monitor does not have to parse the array.
      required: [healthy, probes, alerts]
      properties:
        healthy:
          type: boolean
        probes:
          type: array
          items:
            type: object
            description: >-
              One signal, measured from its own source. A signal whose source could not be read
              reports failing with no value — never a silent pass, never an invented 0.
            required: [name, ok]
            properties:
              name:
                type: string
                description: >-
                  `sponsor_balance`, `indexer_lag`, `pending_certificates`,
                  `verifier_error_rate`, `anchor_verification` — or a name a newer probe added.
              ok:
                type: boolean
              value:
                type: number
                description: Absent when the signal could not be measured.
              threshold:
                type: number
              configSource:
                type: string
                description: >-
                  Where the threshold came from: the default, or the variable that overrode it.
              alert:
                type: string
              unhealthySince:
                type: string
                description: ISO timestamp of the first failing run this streak began with.
              alertCount:
                type: integer
                description: How many times this state has been alerted.
        alerts:
          type: array
          items:
            type: string
        metrics:
          type: object
          description: >-
            The readings the probes were computed from, so an alert can be checked without
            re-measuring.
          properties:
            sponsorBalanceXlm:
              type: number
            indexerLagLedgers:
              type: number
            rpcRetentionLedgers:
              type: number
            indexerLagSeconds:
              type: number
            pendingCertificatesCount:
              type: number
            verifierTotalRequests:
              type: number
            verifierErrorRequests:
              type: number
    Liveness:
      type: object
      description: >-
        The process is up. Says nothing about whether its sources can be read — that is
        /api/ops/health.
      required: [status, uptime]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          description: "Seconds, from `process.uptime()`."
    SyncReport:
      type: object
      description: One indexing pass over every source.
      required: [sources, failures, replayed, deferred]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [source, fromLedger, toLedger, indexed, deferred]
            properties:
              source:
                type: string
              fromLedger:
                type: integer
              toLedger:
                type: integer
              indexed:
                type: integer
              deferred:
                type: integer
                description: >-
                  Events whose pact row does not exist yet; held in `deferred_events` and
                  replayed by later passes.
        failures:
          type: array
          items:
            type: object
            description: >-
              One source this pass could not read. Its cursor did not move, so nothing it had
              not read was marked as read.
            required: [source, reason, cursor, oldestLedger, message]
            properties:
              source:
                type: string
                description: "`pact`, or `refund_vault:<contract>`."
              reason:
                type: string
                enum: [outsideRetention, readFailed]
                description: >-
                  `outsideRetention` will not fix itself: it needs /api/backfill with a history
                  source.
              cursor:
                type: integer
                description: "The ledger this source's pass stopped at."
              oldestLedger:
                type: integer
                description: The oldest ledger the RPC still keeps.
              message:
                type: string
          description: Empty when every source could be read.
        replayed:
          type: integer
          description: "Deferred events this pass's replay wrote."
        deferred:
          type: integer
          description: Deferred events still waiting after the replay.
    SourceFailure:
      type: object
      description: >-
        One source this pass could not read. Its cursor did not move, so nothing it had not read
        was marked as read.
      required: [source, reason, cursor, oldestLedger, message]
      properties:
        source:
          type: string
          description: "`pact`, or `refund_vault:<contract>`."
