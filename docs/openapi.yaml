      required: [batchId, root, leaves, anchorTx, anchoredLedger]
      properties:
        batchId:
          type: integer
        root:
          type: string
          description: "The Merkle root of the batch, as anchored."
        leaves:
          type: integer
        anchorTx:
          type: string
        anchoredLedger:
          type: integer
    BackfillReport:
      type: object
      description: >-
        Ranges read from the history source, then the normal pass that resumed from them.
