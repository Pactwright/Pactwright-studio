                  type: string
                anchoredLedger:
                  type: integer
            - type: "null"
    BackfillRun:
      type: object
      description: >-
        A `/api/backfill` that closed the gaps it could, then resumed the normal pass.
      required: [ok, result]
      properties:
        ok:
          type: boolean
          enum: [true]
        result:
          $ref: "#/components/schemas/BackfillReport"
    CronRefusal:
      type: object
      description: >-
        An operator route that did not complete. `error` names the state to change: `CRON_SECRET
        is not configured` means nothing ran, `outsideRetention` means a source's cursor is
        older than the RPC keeps events for and only a backfill can move it, `noHistorySource`
        means backfill has nothing to read the gap from. Whatever could be read still is, and
        `result` reports it.
      required: [error]
      properties:
        error:
          type: string
        hint:
          type: string
          description: "What to set, when a configuration change is the fix."
        reason:
          type: string
          description: "The history source's own refusal, from `/api/backfill`."
        outsideRetention:
          type: array
          items:
            type: object
            description: >-
              One source this pass could not read. Its cursor did not move, so nothing it had
              not read was marked as read.
