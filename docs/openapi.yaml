    AnchorRun:
      type: object
      description: >-
        A cron route that did its job. `result` is null when there was nothing to do.
      required: [ok, result]
      properties:
        ok:
          type: boolean
          enum: [true]
        result:
          anyOf:
            - type: object
              description: >-
                A batch that was written to the chain. `null` from the route means there was
                nothing to anchor.
              required: [batchId, root, leaves, anchorTx, anchoredLedger]
