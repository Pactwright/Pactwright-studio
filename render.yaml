# Testnet hosting for Studio on Render's Free tier (ROADMAP S-10, studio#26): the web app
# and a managed Postgres without requiring a credit card.
# Indexer sync and anchor tasks are automated via GitHub Actions (.github/workflows/studio-cron.yml).
# Secrets are `sync: false`: Render asks for them when the Blueprint is created.
# Spec: https://render.com/docs/blueprint-spec
projects:
  - name: pactwright-studio
    environments:
      - name: testnet
        databases:
          - name: pactwright-studio-testnet-db
            plan: free
            databaseName: pactwright
            postgresMajorVersion: "16"

        services:
          - type: web
            name: pactwright-studio-testnet
            runtime: node
            plan: free
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
            startCommand: pnpm db:migrate && pnpm --filter web start
            healthCheckPath: /verify
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: DATABASE_URL
                fromDatabase:
                  name: pactwright-studio-testnet-db
                  property: connectionString
              - key: STELLAR_NETWORK
                value: testnet
              - key: NEXT_PUBLIC_STELLAR_NETWORK
                value: testnet
              - key: STELLAR_NETWORK_PASSPHRASE
                value: Test SDF Network ; September 2015
              - key: STELLAR_RPC_URL
                value: https://soroban-testnet.stellar.org
              # Pactwright-contracts deployments/testnet.env
              - key: PACT_CONTRACT_ID
                value: CDUXJJUNYFILEYHE3LITANJEKCDFERNAABOSG75OWATFVM776BCMFEV6
              - key: RECEIPT_ANCHOR_ID
                value: CAEO5GBC3ULRC5RYBSCSOXLNXHU2HZAHNW5HY5LZM3DIPFMX357ILNJ2
              # First ledger to index: the ledger the testnet pacts linked in the README start at.
              - key: INDEX_START_LEDGER
                sync: false
              - key: REFUND_VAULT_IDS
                sync: false
              - key: FACILITATOR_URL
                sync: false
              # The testnet verifier service; /api/ops/health reads its verdict counters (XC-03).
              - key: VERIFIER_URL
                value: https://pactwright-verifier-testnet.onrender.com
              # ReceiptAnchor admin key (testnet only; refused on pubnet).
              - key: ANCHORER_SECRET
                sync: false
              # Secret shared with the cron runner; the cron routes refuse to run without it.
              - key: CRON_SECRET
                generateValue: true
