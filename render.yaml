# Testnet hosting for Studio on Render (ROADMAP S-10, studio#26): the web app, a managed
# Postgres, and the two cron jobs that call /api/sync (every 5 minutes) and /api/anchor
# (hourly). Secrets are `sync: false`: Render asks for them when the Blueprint is created and
# keeps them in its secret store. Never put a value for them in this file.
# Spec: https://render.com/docs/blueprint-spec
projects:
  - name: pactwright-studio
    environments:
      - name: testnet
        databases:
          - name: pactwright-studio-testnet-db
            plan: 0.1c-256mb
            databaseName: pactwright
            postgresMajorVersion: "17"

        services:
          - type: web
            name: pactwright-studio-testnet
            runtime: node
            plan: 0.5c-512mb
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
            preDeployCommand: pnpm db:migrate
            startCommand: pnpm --filter web start
            healthCheckPath: /verify
            autoDeployTrigger: checksPass
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: DATABASE_URL
                fromDatabase:
                  name: pactwright-studio-testnet-db
                  property: connectionString
              - key: STELLAR_NETWORK
                value: testnet
              - key: NEXT_PUBLIC_STELLAR_NETWORK
                value: testnet
              - key: STELLAR_NETWORK_PASSPHRASE
                value: Test SDF Network ; September 2015
              - key: STELLAR_RPC_URL
                value: https://soroban-testnet.stellar.org
              # Pactwright-contracts deployments/testnet.env
              - key: PACT_CONTRACT_ID
                value: CDUXJJUNYFILEYHE3LITANJEKCDFERNAABOSG75OWATFVM776BCMFEV6
              - key: RECEIPT_ANCHOR_ID
                value: CAEO5GBC3ULRC5RYBSCSOXLNXHU2HZAHNW5HY5LZM3DIPFMX357ILNJ2
              # First ledger to index: the ledger the testnet pacts linked in the README start at.
              - key: INDEX_START_LEDGER
                sync: false
              - key: REFUND_VAULT_IDS
                sync: false
              - key: FACILITATOR_URL
                sync: false
              # ReceiptAnchor admin key (testnet only; refused on pubnet).
              - key: ANCHORER_SECRET
                sync: false
              # Shared with the cron jobs below; the cron routes refuse to run without it.
              - key: CRON_SECRET
                generateValue: true

          - type: cron
            name: pactwright-studio-testnet-sync
            runtime: node
            plan: 0.5c-512mb
            schedule: "*/5 * * * *"
            buildCommand: "true"
            startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "http://$STUDIO_HOSTPORT/api/sync"'
            envVars:
              - key: STUDIO_HOSTPORT
                fromService:
                  name: pactwright-studio-testnet
                  type: web
                  property: hostport
              - key: CRON_SECRET
                fromService:
                  name: pactwright-studio-testnet
                  type: web
                  envVarKey: CRON_SECRET

          - type: cron
            name: pactwright-studio-testnet-anchor
            runtime: node
            plan: 0.5c-512mb
            schedule: "0 * * * *"
            buildCommand: "true"
            startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "http://$STUDIO_HOSTPORT/api/anchor"'
            envVars:
              - key: STUDIO_HOSTPORT
                fromService:
                  name: pactwright-studio-testnet
                  type: web
                  property: hostport
              - key: CRON_SECRET
                fromService:
                  name: pactwright-studio-testnet
                  type: web
                  envVarKey: CRON_SECRET
